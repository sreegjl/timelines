name: Build macOS Intel (x64)

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-intel:
    runs-on: macos-15-intel
    steps:
      - name: Check out tagged source (or current revision)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app resources
        run: npm run build

      - name: Package Intel DMG without publishing updater metadata
        run: npx --no-install electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Intel executable and give DMG a unique name
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find release -type d -name 'Timelines.app' -print -quit)"
          test -n "$APP"
          file "$APP/Contents/MacOS/Timelines"
          file "$APP/Contents/MacOS/Timelines" | grep -q 'x86_64'

          shopt -s nullglob
          DMGS=(release/*.dmg)
          test "${#DMGS[@]}" -eq 1
          VERSION="$(node -p "require('./package.json').version")"
          mv "${DMGS[0]}" "release/Timelines-${VERSION}-macOS-Intel-x64.dmg"

      - name: Save Intel DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timelines-macOS-Intel-x64
          path: release/*-macOS-Intel-x64.dmg
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: build-intel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: Timelines-macOS-Intel-x64
          path: dist

      - name: Attach the Intel installer to the existing release
        run: gh release upload "$RELEASE_TAG" dist/*-macOS-Intel-x64.dmg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
