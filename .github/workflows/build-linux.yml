name: Build Linux AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build x64 AppImage for manual run
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Build and publish x64 AppImage
        if: github.event_name == 'release'
        run: npx electron-builder --linux AppImage --x64 --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timelines-Linux-x64
          path: |
            release/*.AppImage
            release/latest-linux.yml
